<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理系统</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .preload {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
      }
  
      .circular {
        height: 42px;
        width: 42px;
        animation: loading-rotate 2s linear infinite;
      }
  
      .circular .path {
        animation: loading-dash 1.5s ease-in-out infinite;
        stroke-dasharray: 90, 150;
        stroke-dashoffset: 0;
        stroke-width: 2;
        stroke: #4073fa;
        stroke-linecap: round;
      }
  
      @keyframes loading-rotate {
        100% {
          transform: rotate(1turn);
        }
      }
  
      @keyframes loading-dash {
  
        0% {
          stroke-dasharray: 90, 150;
          stroke-dashoffset: -40px;
        }
  
        100% {
          stroke-dasharray: 90, 150;
          stroke-dashoffset: -120px;
        }
      }
    </style>
  </head>
  <body>
    <!--
      THESIS: A working nail studio operations desk, not a generic admin dashboard or decorative AI template.
      OWN-WORLD: Warm porcelain canvas, paper-white work surfaces, hairline taupe rules, restrained dusty-rose focus, square editorial modules.
      STORY: Operators see pending nail work, start a text or reference design, inspect recent assets, and enter the same traceable AI workflow.
      FIRST VIEWPORT: A compact studio heading leads into a four-cell production strip, then creation, latest run, asset and task regions above the fold.
      FORM: Reference-pinned editorial operations board; seed dd920022.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app">
      <div class="preload">
        <svg viewBox="25 25 50 50" class="circular">
          <circle cx="50" cy="50" r="20" fill="none" class="path"></circle>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
