# 项目配置
like:
  upload-directory: /www/uploads/likeadmin-java/ # 上传目录
  # 前端静态资源目录；留空时只提供 API，由部署环境按需设置 LIKEADMIN_WEB_DIRECTORY
  web-directory: ${LIKEADMIN_WEB_DIRECTORY:}
  cors:
    allowed-origin-patterns: ${LIKEADMIN_CORS_ALLOWED_ORIGINS:http://127.0.0.1:*,http://localhost:*}
  # 验证码配置
  captcha:
    # 是否开启验证码
    status: true
    # 验证码有效时长
    expire: 120
    # 验证码缓存键名
    token: "captcha:key:"
  # Swagger配置
  swagger:
    # 是否开启swagger
    enabled: true
    # 请求前缀
    pathMapping: /dev-api

# 服务配置
server:
  port: 8082
  servlet:
    context-path: /

# 框架配置
spring:
  profiles:
    active: dev,local
  mvc:
    static-path-pattern: /api/static/**
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/meijia?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    type: com.zaxxer.hikari.HikariDataSource # 数据源类型
    driver-class-name: com.mysql.jdbc.Driver # MySql的驱动
    username: root # 数据库账号
    password: ${DB_PASSWORD:} # 数据库密码
    hikari:
      connection-timeout: 30000     # 等待连接分配连接的最大时长(毫秒),超出时长还没可用连接则发送SQLException,默认30秒
      minimum-idle: 5               # 最小连接数
      maximum-pool-size: 20         # 最大连接数
      auto-commit: true             # 自动提交
      idle-timeout: 600000          # 连接超时的最大时长(毫秒),超时则被释放(retired),默认10分钟
      pool-name: DateSourceHikariCP # 连接池名称
      max-lifetime: 1800000         # 连接的生命时长(毫秒),超时而且没被使用则被释放,默认30分钟(1800000ms)
      connection-init-sql: SELECT 1 # 连接时发起SQL测试脚本
  # 限制配置
  servlet:
    multipart:
      max-file-size: 100MB    # 文件上传大小限制
      max-request-size: 100MB # 文件最大请求限制
      enabled: true
  # Redis配置
  redis:
    host: localhost   # Redis服务地址
    port: 6379        # Redis端口
    password:         # Redis密码
    database: 0       # 数据库索引
    timeout: 5000     # 连接超时
    lettuce:
      pool:
        max-wait: 30000 # 连接池最大阻塞等待时间(使用负数表示没有限制,默认-1)
        max-active: 100 # 连接池最大连接数(使用负数表示没有限制,默认8)
        max-idle: 20    # 连接池中的最大空闲连接(默认8)
        min-idle: 0     # 连接池中的最小空闲连接(默认0)

# Mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**Mapper.xml
  typeAliasesPackage: com.mdd.**.mapper
  global-config:
    banner: false
    db-config:
      table-prefix: la_
  configuration-properties:
    prefix: la_

# Sa-token配置
sa-token:
  token-name: like-admin  # token的名称
  timeout: 2592000        # token有效期单位s(默认30天,-1代表永不过期)
  activity-timeout: -1    # token临时有效期(指定时间无操作掉线)
  is-concurrent: true     # 是否允许同一账号并发登录
  is-share: false         # 多人同登账号共用token
  token-style: random-64  # token生成的风格
  is-print: false         # 打印版本字符画
  is-log: false           # 是否输出操作日志

# 美甲 AI 配置：敏感信息只从环境变量注入
nail:
  creation-bridge:
    admin-login-url: ${NAIL_CREATION_BRIDGE_ADMIN_LOGIN_URL:http://127.0.0.1:5173/login}
    public-ai-url: ${NAIL_CREATION_BRIDGE_PUBLIC_AI_URL:http://127.0.0.1:8082/nail-site/AI.html}
    ticket-ttl-seconds: ${NAIL_CREATION_BRIDGE_TICKET_TTL_SECONDS:600}
  asset:
    # 生产环境通过环境变量注入至少32位随机值；留空时每次启动生成临时密钥。
    signing-secret: ${NAIL_ASSET_SIGNING_SECRET:}
  ai:
    provider: volcengine
    public-enabled: ${NAIL_AI_PUBLIC_ENABLED:false}
    public-hourly-limit: ${NAIL_AI_PUBLIC_HOURLY_LIMIT:6}
    worker-concurrency: ${NAIL_AI_WORKER_CONCURRENCY:2}
    prompt-template-version: ${NAIL_PROMPT_TEMPLATE_VERSION:nail-designer-v2}
    volcengine:
      api-key: ${VOLC_ARK_API_KEY:}
      model: ${VOLC_ARK_MODEL:doubao-seedream-4-0-250828}
      base-url: ${VOLC_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
