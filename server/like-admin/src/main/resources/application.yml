# 项目配置
like:
  upload-directory: /www/uploads/likeadmin-java/ # 上传目录
  # 前端静态资源目录；留空时只提供 API，由部署环境按需设置 LIKEADMIN_WEB_DIRECTORY
  web-directory: ${LIKEADMIN_WEB_DIRECTORY:}
  cors:
    allowed-origin-patterns: ${LIKEADMIN_CORS_ALLOWED_ORIGINS:http://127.0.0.1:*,http://localhost:*}
  # 验证码配置
  captcha:
    # 是否开启验证码
    status: true
    # 验证码有效时长
    expire: 120
    # 验证码缓存键名
    token: "captcha:key:"
  # Swagger配置
  swagger:
    # 是否开启swagger
    enabled: true
    # 请求前缀
    pathMapping: /dev-api

# 服务配置
server:
  port: 8082
  servlet:
    context-path: /

# 框架配置
spring:
  profiles:
    active: dev,local
  mvc:
    static-path-pattern: /api/static/**
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/meijia?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
    type: com.zaxxer.hikari.HikariDataSource # 数据源类型
    driver-class-name: com.mysql.jdbc.Driver # MySql的驱动
    username: root # 数据库账号
    password: ${DB_PASSWORD:} # 数据库密码
    hikari:
      connection-timeout: 30000     # 等待连接分配连接的最大时长(毫秒),超出时长还没可用连接则发送SQLException,默认30秒
      minimum-idle: 5               # 最小连接数
      maximum-pool-size: 20         # 最大连接数
      auto-commit: true             # 自动提交
      idle-timeout: 600000          # 连接超时的最大时长(毫秒),超时则被释放(retired),默认10分钟
      pool-name: DateSourceHikariCP # 连接池名称
      max-lifetime: 1800000         # 连接的生命时长(毫秒),超时而且没被使用则被释放,默认30分钟(1800000ms)
      connection-init-sql: SELECT 1 # 连接时发起SQL测试脚本
  # 限制配置
  servlet:
    multipart:
      max-file-size: 100MB    # 文件上传大小限制
      max-request-size: 100MB # 文件最大请求限制
      enabled: true
  # Redis配置
  redis:
    host: localhost   # Redis服务地址
    port: 6379        # Redis端口
    password:         # Redis密码
    database: 0       # 数据库索引
    timeout: 5000     # 连接超时
    lettuce:
      pool:
        max-wait: 30000 # 连接池最大阻塞等待时间(使用负数表示没有限制,默认-1)
        max-active: 100 # 连接池最大连接数(使用负数表示没有限制,默认8)
        max-idle: 20    # 连接池中的最大空闲连接(默认8)
        min-idle: 0     # 连接池中的最小空闲连接(默认0)

# Mybatis-plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**Mapper.xml
  typeAliasesPackage: com.mdd.**.mapper
  global-config:
    banner: false
    db-config:
      table-prefix: la_
  configuration-properties:
    prefix: la_

# Sa-token配置
sa-token:
  token-name: like-admin  # token的名称
  timeout: 2592000        # token有效期单位s(默认30天,-1代表永不过期)
  activity-timeout: -1    # token临时有效期(指定时间无操作掉线)
  is-concurrent: true     # 是否允许同一账号并发登录
  is-share: false         # 多人同登账号共用token
  token-style: random-64  # token生成的风格
  is-print: false         # 打印版本字符画
  is-log: false           # 是否输出操作日志

# 美甲 AI 配置：敏感信息只从环境变量注入
nail:
  creation-bridge:
    admin-login-url: ${NAIL_CREATION_BRIDGE_ADMIN_LOGIN_URL:http://127.0.0.1:8082/admin/index.html#/login}
    admin-ai-url: ${NAIL_CREATION_BRIDGE_ADMIN_AI_URL:http://127.0.0.1:8082/admin/index.html#/nail/ai}
    public-ai-url: ${NAIL_CREATION_BRIDGE_PUBLIC_AI_URL:http://127.0.0.1:8082/nail-site/AI.html}
    ticket-ttl-seconds: ${NAIL_CREATION_BRIDGE_TICKET_TTL_SECONDS:600}
  asset:
    # 生产环境通过环境变量注入至少32位随机值；留空时每次启动生成临时密钥。
    signing-secret: ${NAIL_ASSET_SIGNING_SECRET:}
  ai:
    provider: volcengine
    public-enabled: ${NAIL_AI_PUBLIC_ENABLED:false}
    public-hourly-limit: ${NAIL_AI_PUBLIC_HOURLY_LIMIT:6}
    worker-concurrency: ${NAIL_AI_WORKER_CONCURRENCY:2}
    prompt-template-version: ${NAIL_PROMPT_TEMPLATE_VERSION:nail-designer-v2}
    volcengine:
      api-key: ${VOLC_ARK_API_KEY:}
      # 默认使用 Seedream 5.0 Pro（配额已恢复）；切换模型只需改 VOLC_ARK_MODEL 或下方默认值：
      #   5.0 Pro  ep-20260814004823-6kd24（当前默认，质量最高）
      #   5.0 Lite ep-20260814005153-f6fcg（更快更省，质量稍低）
      #   4.5      ep-20260814005244-8dwk6
      #   4.0      ep-20260814005309-bnl9h
      model: ${VOLC_ARK_MODEL:ep-20260814004823-6kd24}
      base-url: ${VOLC_ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      # 注意：Seedream 5.0 端点不支持 guidance_scale，此值当前不生效，仅保留给兼容模型使用。
      guidance-scale: ${VOLC_ARK_GUIDANCE_SCALE:4.0}
      # 提示词优化：必须为 true——实测 4.x 端点不接受 false（会 400 拒绝）。
      optimize-prompt: ${VOLC_ARK_OPTIMIZE_PROMPT:true}
      # 提示词风格档案：auto 自动识别 / seedream-4 / seedream-4-5 / seedream-5-lite / seedream-5-pro
      prompt-profile: ${VOLC_ARK_PROMPT_PROFILE:seedream-5-pro}
      fallback-models: ${VOLC_ARK_FALLBACK_MODELS:ep-20260814005244-8dwk6,ep-20260814005309-bnl9h}
    # 出图后处理：轻量锐化（不影响生成质量，只增强边缘观感）
    postprocess:
      enabled: ${NAIL_AI_POSTPROCESS_ENABLED:true}
      sharpen-amount: ${NAIL_AI_SHARPEN_AMOUNT:0.35}
    # 云美学打分（智谱 GLM 免费视觉模型）：注册 open.bigmodel.cn 拿 Key 后设置 NAIL_AI_AESTHETIC_API_KEY 即启用
    aesthetic:
      enabled: ${NAIL_AI_AESTHETIC_ENABLED:false}
      # zhipu（智谱 GLM，默认）| ark（火山豆包视觉，需买服务包）
      provider: ${NAIL_AI_AESTHETIC_PROVIDER:zhipu}
      api-key: ${NAIL_AI_AESTHETIC_API_KEY:}
      base-url: ${NAIL_AI_AESTHETIC_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      # 默认 glm-4v-flash：非推理模型，直接输出数字，稳定秒回；
      # 也可换 glm-4.6v-flash（更强但推理链长，需更大 max_tokens）。
      vision-model: ${NAIL_AI_AESTHETIC_VISION_MODEL:glm-4v-flash}
      score-prompt: ${NAIL_AI_AESTHETIC_SCORE_PROMPT:对这张美甲效果图按美学质量打分（1-10分，保留一位小数），只返回一个数字。}
      timeout-seconds: ${NAIL_AI_AESTHETIC_TIMEOUT:90}
  redis-auto-start:
    # 后端启动后自动拉起本地 Redis（开发环境兜底）
    enabled: ${NAIL_REDIS_AUTO_START:true}
    server-path: ${NAIL_REDIS_SERVER_PATH:C:/Users/15367/AppData/Local/Microsoft/WinGet/Packages/taizod1024.redis-windows-fork_Microsoft.Winget.Source_8wekyb3d8bbwe/Redis-8.8.0-Windows-x64-msys2/redis-server.exe}
